<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

ecs/authentication", "source": "specs/secure-access", "target": "specs/authentication"}}, {"data": {"id": "specs/secure-access__specs/notifications", "source": "specs/secure-access", "target": "specs/notifications"}}, {"data": {"id": "specs/secure-access__frontend/auth", "source": "specs/secure-access", "target": "frontend/auth"}}, {"data": {"id": "specs/timed-reading__backend/reading_gate", "source": "specs/timed-reading", "target": "backend/reading_gate"}}, {"data": {"id": "specs/timed-reading__specs/comprehension-test", "source": "specs/timed-reading", "target": "specs/comprehension-test"}}, {"data": {"id": "specs/timed-reading__specs/audit-log", "source": "specs/timed-reading", "target": "specs/audit-log"}}, {"data": {"id": "specs/timed-reading__specs/course-management", "source": "specs/timed-reading", "target": "specs/course-management"}}, {"data": {"id": "specs/timed-reading__frontend/components", "source": "specs/timed-reading", "target": "frontend/components"}}], "bodies": {"backend/ai_generation": "# AI Generation (Django App)\n\nApp Django para generaci\u00f3n de contenido con LLM externo, BYO key, y protecci\u00f3n PII.\n\n## Modelos\n\n- **AdminLLMKey**: API key cifrada por admin (AES-GCM, nunca expuesta)\n\n## Views/APIs\n\n- Admin: store LLM key (POST /api/ai/key)\n- Admin: guided content generation (POST /api/ai/generate-content)\n- Admin: PDF-to-test generation (POST /api/ai/generate-test)\n\n## Client\n\n- **OpenAICompatibleClient**: Interfaz unificada (base_url, api_key, model) para cualquier provider\n- **FakeLLMClient**: Mock para testing (no API calls)\n\n## Relaciones\n\n- Spec: [AI Generation](../specs/ai-generation.md)\n- Relacionado: [Course Management](../specs/course-management.md) (content/test generation)\n- Frontend: [Admin](../frontend/admin.md) (AiKeyForm, GuidedContent, PdfTestGen - lazy loaded)\n\n## Dependencias\n\n- Importa: [Common](../backend/common.md) (crypto para key encryption)\n- No tiene circular dependencies\n- Sanitizer deliberadamente NO importa employees (PII exclusion by construction)\n\n## Patrones clave\n\n- Provider-agnostic: OpenAI-compatible interface\n- AdminLLMKey cifrado con AES-GCM + random nonce\n- Raw key NUNCA en serialized responses\n- Sanitizer: PII exclusion by construction (no importa employees)\n- HITL: draft NO se persiste hasta explicit save del admin", "backend/authentication": "# Authentication (Django App)\n\nApp Django para autenticaci\u00f3n admin (session) y employee (token), con middleware de aislamiento.\n\n## Modelos\n\n- **EmployeeAccessToken**: Token de acceso para empleados (cifrado, un solo uso, expirable)\n\n## Views/APIs\n\n- Admin login (POST /api/auth/login)\n- Admin logout (POST /api/auth/logout)\n- Employee redeem (POST /api/auth/redeem)\n\n## Middleware\n\n- **RoleIsolationMiddleware**: A\u00edsla sesiones admin/employee; employee token NO concede acceso admin\n\n## Relaciones\n\n- Spec: [Authentication](../specs/authentication.md)\n- Spec: [Secure Access](../specs/secure-access.md) (EmployeeAccessToken)\n- Importado por: [Notifications](../backend/notifications.md) (EmployeeAccessToken)\n- Frontend: [Auth](../frontend/auth.md) (AdminLogin, EmployeeRedeem, AuthContext)\n\n## Dependencias\n\n- Importa: [Employees](../backend/employees.md) (Employee model)\n- Importa: [Common](../backend/common.md) (parsing, rate_limit utilities)\n- No tiene circular dependencies\n\n## Patrones clave\n\n- Django session para admin (no JWT)\n- Token cifrado con AES-GCM + random nonce\n- HMAC para dedup determin\u00edstico\n- Raw token NUNCA en serialized responses\n- Middleware enforce role isolation en cada request", "backend/certificates": "# Certificates (Django App)\n\nApp Django para generaci\u00f3n de certificados PDF y sistema de badges.\n\n## Modelos\n\n- **Certificate**: PDF generado por enrollment (one per passed enrollment)\n- **Badge**: Definici\u00f3n de badge (nombre, descripci\u00f3n, criteria)\n- **EmployeeBadge**: Badge otorgado a empleado (timestamp)\n\n## Services\n\n- **generate_certificate**: Genera PDF con datos del empleado, curso, resultado\n- **award_badge**: Otorga badge a empleado si cumple criteria\n\n## Relaciones\n\n- Spec: [Certificate](../specs/certificate.md)\n- Spec: [Badges](../specs/badges.md)\n- Importado por: [Reading Gate](../backend/reading_gate.md) (lazy: services \u2192 generate_certificate, award_badge)\n- Frontend: [Admin](../frontend/admin.md) (admin downloads PDF)\n\n## Dependencias\n\n- Importa: [Employees](../backend/employees.md) (Employee model)\n- Importa: [Reading Gate](../backend/reading_gate.md) (Enrollment, Expediente)\n- Importa: [Courses](../backend/courses.md) (Course lazy import)\n- Lazy import en: [Reading Gate](../backend/reading_gate.md) (views \u2192 audit events)\n\n## Patrones clave\n\n- Lazy imports para evitar circular dependencies\n- Certificate regeneration = deterministic (mismo contenido)\n- Badge award autom\u00e1tico (no manual)", "backend/common": "# Common (Utility Package)\n\nPackage compartido con utilidades transversales (no es Django app, es m\u00f3dulo Python).\n\n## M\u00f3dulos\n\n- **crypto.py**: AES-GCM encryption/decryption, key derivation, HMAC\n- **fields.py**: EncryptedDNIField, HashedDNILookupField (Django model fields)\n- **dni.py**: DNI validation (formato espa\u00f1ol + control letter)\n- **parsing.py**: JSON body parsing utilities\n- **rate_limit.py**: Rate limiting decorator\n- **retention.py**: Retention policy configuration\n\n## Relaciones\n\n- Importado por: [Employees](../backend/employees.md) (crypto, fields, dni)\n- Importado por: [Authentication](../backend/authentication.md) (parsing, rate_limit)\n- Importado por: [Reading Gate](../backend/reading_gate.md) (retention)\n- Importado por: [AI Generation](../backend/ai_generation.md) (crypto)\n- Importado por: [Courses](../backend/courses.md) (parsing)\n- Spec: [Employee Import](../specs/employee-import.md) (DNI utilities)\n- Spec: [AI Generation](../specs/ai-generation.md) (crypto para key encryption)\n\n## Patrones clave\n\n- Leaf module: no importa de otras apps del proyecto\n- EncryptedDNIField: AES-GCM + random nonce (non-deterministic ciphertext)\n- HashedDNILookupField: HMAC para dedup sin exponer plaintext\n- Retention policy configurable via settings", "backend/courses": "# Courses (Django App)\n\nApp Django para gesti\u00f3n de cursos, secciones, preguntas y posiciones.\n\n## Modelos\n\n- **Course**: T\u00edtulo, descripci\u00f3n, metadata del curso\n- **Section**: PDFs dentro de un curso, con orden y minTimePerSection\n- **Question**: Preguntas del question bank (single correct answer)\n- **QuestionBank**: Contenedor de preguntas por curso\n- **Position**: Posiciones de trabajo (mapeo N:M con cursos)\n\n## Views/APIs\n\n- Course CRUD (admin-only)\n- Section management\n- Question bank management\n- Position-catalog listing\n\n## Relaciones\n\n- Spec: [Course Management](../specs/course-management.md)\n- Spec: [Comprehension Test](../specs/comprehension-test.md) (Question model)\n- Spec: [Timed Reading](../specs/timed-reading.md) (Section model)\n- Spec: [Enrollment Assignment](../specs/enrollment-assignment.md) (Position model)\n- Importado por: [Reading Gate](../backend/reading_gate.md) (Course, Section, Question, Position)\n- Importado por: [Certificates](../backend/certificates.md) (Course lazy import)\n- Frontend: [Admin](../frontend/admin.md) (CourseManagement component)\n\n## Dependencias\n\n- Importa: [Common](../backend/common.md) (parsing utilities)\n- No tiene dependencias circulares", "backend/employees": "# Employees (Django App)\n\nApp Django para gesti\u00f3n de empleados con cifrado DNI y importaci\u00f3n Excel.\n\n## Modelos\n\n- **Employee**: Nombre, email, DNI cifrado (AES-GCM), HMAC lookup, posici\u00f3n\n\n## Views/APIs\n\n- Employee Excel import (POST /api/import)\n- Employee listing\n\n## Relaciones\n\n- Spec: [Employee Import](../specs/employee-import.md)\n- Spec: [Secure Access](../specs/secure-access.md) (Employee referenced by token)\n- Importado por: [Authentication](../backend/authentication.md) (Employee model)\n- Importado por: [Reading Gate](../backend/reading_gate.md) (Employee model)\n- Importado por: [Certificates](../backend/certificates.md) (Employee model)\n- Frontend: [Admin](../frontend/admin.md) (EmployeeImport component)\n\n## Dependencias\n\n- Importa: [Common](../backend/common.md) (crypto, fields, dni utilities)\n- Importa: [Reading Gate](../backend/reading_gate.md) (assign_mandatory_courses en views)", "backend/notifications": "# Notifications (Django App)\n\nApp Django para notificaciones email con transporte configurable y templates en espa\u00f1ol.\n\n## Modelos\n\n- **NotificationLog**: Log de notificaciones enviadas (recipient, status, timestamp)\n\n## Services\n\n- **send_notification**: Env\u00eda email via transporte configurado (console/smtp/resend)\n- **send_token_email**: Env\u00eda magic-link/token a empleado\n\n## Transports\n\n- **Console**: Para desarrollo (print to stdout)\n- **SMTP**: Para producci\u00f3n gen\u00e9rica\n- **Resend**: Para producci\u00f3n (API-based)\n\n## Relaciones\n\n- Spec: [Notifications](../specs/notifications.md)\n- Spec: [Secure Access](../specs/secure-access.md) (token delivery)\n- Importado por: [Reading Gate](../backend/reading_gate.md) (lazy: services \u2192 send_notification)\n- Importado por: [Authentication](../backend/authentication.md) (EmployeeAccessToken referenced)\n\n## Dependencias\n\n- Importa: [Authentication](../backend/authentication.md) (EmployeeAccessToken)\n- Importa: [Reading Gate](../backend/reading_gate.md) (Enrollment en views)\n- No tiene circular dependencies\n\n## Patrones clave\n\n- Email transport abstraction (configurable en settings)\n- Templates hardcoded en espa\u00f1ol (no i18n para MVP)\n- NotificationLog append-only (evidence trail)", "backend/reading_gate": "# Reading Gate (Django App)\n\nCore del sistema \u2014 motor de compliance para lectura cronometrada, tests, audit y expediente.\n\n## Modelos\n\n- **Enrollment**: Empleado + Curso, status, fechas\n- **ReadingProgress**: Progress por enrollment (accumulated time, reached section)\n- **AuditEvent**: Append-only log de eventos (section unlock, attempt, certificate)\n- **Expediente**: Resultado por enrollment (status, attempts, score, dates)\n\n## Services\n\n- **process_heartbeat**: Heartbeat validation + time accumulation\n- **check_gate**: Server-gated section unlock (minTimePerSection)\n- **process_test_submission**: Test scoring + pass/fail + result storage\n- **assign_mandatory_courses**: Auto-assignment post-import\n- **generate_certificate**: Certificate PDF generation (lazy import a certificates.services)\n\n## Relaciones\n\n- Spec: [Timed Reading](../specs/timed-reading.md) (heartbeat, gate)\n- Spec: [Comprehension Test](../specs/comprehension-test.md) (test submission)\n- Spec: [Audit Log](../specs/audit-log.md) (AuditEvent)\n- Spec: [Expediente](../specs/expediente.md) (Expediente model)\n- Spec: [Enrollment Assignment](../specs/enrollment-assignment.md) (assign_mandatory_courses)\n- Importado por: [Employees](../backend/employees.md) (views \u2192 assign_mandatory_courses)\n- Importado por: [Certificates](../backend/certificates.md) (Enrollment, Expediente)\n- Importado por: [Notifications](../backend/notifications.md) (Enrollment)\n- Frontend: [Components](../frontend/components.md) (PdfReader heartbeat)\n\n## Dependencias\n\n- Importa: [Courses](../backend/courses.md) (Course, Section, Question, Position)\n- Importa: [Employees](../backend/employees.md) (Employee model)\n- Importa: [Common](../backend/common.md) (retention policy)\n- Lazy imports: [Notifications](../backend/notifications.md), [Certificates](../backend/certificates.md) (evitar circular)\n\n## Patrones clave\n\n- Server-authoritative: todas las decisiones de gate se computan server-side\n- Lazy imports para evitar circular dependencies\n- AuditEvent: append-only, sin API de create/update/delete", "frontend/admin": "# Admin (Frontend)\n\nPanel de administraci\u00f3n \u2014 dashboard, import, gesti\u00f3n de cursos, expediente, y p\u00e1ginas AI (lazy-loaded).\n\n## Archivos\n\n- **AdminApp.tsx**: Router admin (lazy-loads AI pages)\n- **Dashboard.tsx**: Charts (recharts) para expedientes\n- **EmployeeImport.tsx**: Excel upload + reporte de importaci\u00f3n\n- **CourseManagement.tsx**: CRUD de cursos + question bank\n- **ExpedienteList.tsx**: Tabla filtrable/paginated de expedientes\n\n### AI Pages (lazy-loaded via React.lazy)\n- **ai/AiKeyForm.tsx**: Formulario BYO LLM key (react-hook-form + zod)\n- **ai/GuidedContent.tsx**: Generaci\u00f3n guiada de contenido + auto-save\n- **ai/PdfTestGen.tsx**: Generaci\u00f3n de tests desde PDF\n\n## Relaciones\n\n- Spec: [Course Management](../specs/course-management.md)\n- Spec: [Employee Import](../specs/employee-import.md)\n- Spec: [Expediente](../specs/expediente.md)\n- Spec: [AI Generation](../specs/ai-generation.md)\n- Backend: [Courses](../backend/courses.md), [Employees](../backend/employees.md), [Reading Gate](../backend/reading_gate.md), [AI Generation](../backend/ai_generation.md)\n- Frontend: [Auth](../frontend/auth.md) (ProtectedRoute)\n- Frontend: [Components](../frontend/components.md) (layout, UI)\n\n## Dependencias\n\n- Importa: [Auth](../frontend/auth.md) (ProtectedRoute, AuthContext)\n- Importa: [API](../frontend/api.md) (endpoints)\n- Importa: [Components](../frontend/components.md) (layout, UI primitives)\n- Importa: ToastContext, ThemeContext\n\n## Patrones clave\n\n- AI pages lazy-loaded (code-split via React.lazy)\n- Dashboard usa recharts para gr\u00e1ficos\n- react-hook-form + zod para validaci\u00f3n de formularios", "frontend/api": "# API (Frontend)\n\nCapa de API \u2014 cliente Axios con interceptor de auth y endpoints tipados.\n\n## Archivos\n\n- **client.ts**: Instancia Axios con interceptor (redirect a login si 401)\n- **endpoints.ts**: Funciones API tipadas (auth, import, courses, banks, AI)\n\n## Relaciones\n\n- Backend: [Authentication](../backend/authentication.md), [Employees](../backend/employees.md), [Courses](../backend/courses.md), [AI Generation](../backend/ai_generation.md)\n- Usado por: [Auth](../frontend/auth.md) (AuthContext, AdminLogin, EmployeeRedeem)\n- Usado por: [Admin](../frontend/admin.md) (Dashboard, EmployeeImport, CourseManagement, AI pages)\n- Usado por: [Employee](../frontend/employee.md) (EmployeeApp)\n\n## Patrones clave\n\n- Axios interceptor: redirect a login si 401\n- Endpoints tipados con TypeScript\n- Cliente compartido (single Axios instance)", "frontend/auth": "# Auth (Frontend)\n\nCapa de autenticaci\u00f3n del frontend \u2014 contexto, formularios, y route guards.\n\n## Archivos\n\n- **AuthContext.tsx**: Context provider con estado auth (admin/employee), login/logout/redeem\n- **AdminLogin.tsx**: Formulario de login admin (username/password)\n- **EmployeeRedeem.tsx**: Formulario de redeem employee (c\u00f3digo/token)\n- **ProtectedRoute.tsx**: Route guard por rol (admin/employee)\n\n## Relaciones\n\n- Spec: [Authentication](../specs/authentication.md)\n- Spec: [Secure Access](../specs/secure-access.md)\n- Backend: [Authentication](../backend/authentication.md) (API calls)\n- Frontend: [API](../frontend/api.md) (auth endpoints)\n- Usado por: [Admin](../frontend/admin.md) (AdminApp wraps with ProtectedRoute)\n- Usado por: [Employee](../frontend/employee.md) (EmployeeApp wraps with ProtectedRoute)\n\n## Dependencias\n\n- Importa: [API](../frontend/api.md) (auth endpoints)\n- Importa: [Components](../frontend/components.md) (UI primitives)\n- Importa: ToastContext (notifications)", "frontend/components": "# Components (Frontend)\n\nComponentes compartidos \u2014 primitivas UI, layout, lector PDF, error boundary.\n\n## UI Primitives (13 componentes)\n\n- Button, Card, Badge, Input, Modal, EmptyState, Spinner, Skeleton, Toast, ConfirmDialog, ProgressBar, ThemeToggle, ResponsiveTable\n\n## Layout\n\n- **AdminLayout.tsx**: Sidebar + responsive layout\n- **AdminSidebar.tsx**: Navegaci\u00f3n lateral\n- **Breadcrumb.tsx**: Breadcrumb navigation\n- **NetworkBanner.tsx**: Online/offline banner\n\n## Components\n\n- **PdfReader/index.tsx**: Lector PDF con heartbeat (active-time tracking)\n- **ErrorBoundary.tsx**: Error boundary wrapper\n\n## Relaciones\n\n- Spec: [Timed Reading](../specs/timed-reading.md) (PdfReader heartbeat)\n- Usado por: [Admin](../frontend/admin.md) (layout, UI)\n- Usado por: [Employee](../frontend/employee.md) (PdfReader, UI)\n- Usado por: [Auth](../frontend/auth.md) (UI primitives)\n\n## Patrones clave\n\n- Barrel export via ui/index.ts\n- PdfReader env\u00eda heartbeats al backend (active-time validation)\n- ThemeToggle integrado en AdminSidebar\n- ResponsiveTable para tablas adaptables", "frontend/employee": "# Employee (Frontend)\n\nPortal del empleado \u2014 lista de enrollments, lector PDF, badges.\n\n## Archivos\n\n- **EmployeeApp.tsx**: Router employee con enrollment list + PDF reader route\n\n## Relaciones\n\n- Spec: [Timed Reading](../specs/timed-reading.md) (PDF reader con heartbeat)\n- Spec: [Badges](../specs/badges.md) (badge display)\n- Backend: [Reading Gate](../backend/reading_gate.md) (enrollment, heartbeat)\n- Frontend: [Auth](../frontend/auth.md) (ProtectedRoute)\n- Frontend: [Components](../frontend/components.md) (PdfReader)\n\n## Dependencias\n\n- Importa: [Auth](../frontend/auth.md) (ProtectedRoute, AuthContext)\n- Importa: [API](../frontend/api.md) (client)\n- Importa: [Components](../frontend/components.md) (PdfReader, UI)", "specs/ai-generation": "# AI Generation\n\nGeneraci\u00f3n de contenido y tests con LLM externo (BYO key), human-in-the-loop, y protecci\u00f3n PII.\n\n## Requisitos clave\n\n- **BYO LLM Key**: Admin almacena su propia API key (OpenAI-compatible), cifrada at-rest\n- **Key Isolation**: Raw key NUNCA se expone en respuestas, logs, audit, o rutas employee\n- **OpenAI-Compatible Client**: Interfaz unificada (base_url, api_key, model) para cualquier provider\n- **Guided Content Gen**: Admin responde preguntas guiadas + sube docs \u2192 draft para revisi\u00f3n\n- **PDF-to-Test Gen**: Admin sube PDF \u2192 AI genera questions para question bank\n- **HITL**: Draft NO se persiste hasta explicit save del admin\n- **PII Guard**: Sanitizer excluye PII antes de enviar a LLM (sanitizer NO importa employees)\n\n## Relaciones\n\n- Implementado en: [Backend AI Generation](../backend/ai_generation.md)\n- Relacionado: [Course Management](../specs/course-management.md) (content/test generation)\n- Relacionado: [Common](../backend/common.md) (crypto para key encryption)\n- Frontend: [Admin](../frontend/admin.md) (AiKeyForm, GuidedContent, PdfTestGen - lazy loaded)\n\n## Decisiones de dise\u00f1o\n\n- Provider-agnostic: OpenAI-compatible interface (OpenAI/Groq/Together/Ollama)\n- FakeLLMClient para testing (no API calls)\n- Sanitizer deliberadamente NO importa employees (PII exclusion by construction)\n- AdminLLMKey cifrado con AES-GCM + random nonce\n- Raw key NUNCA en serialized responses (override de to_representation)", "specs/audit-log": "# Audit Log\n\nAudit log append-only para eventos de lectura y examen. Inmutable, con contexto de dispositivo.\n\n## Requisitos clave\n\n- **Append-Only**: Audit log solo permite append; NO edit, NO delete por application users\n- **No Mutation**: Sistema rechaza cualquier update/delete en audit records\n- **Cross-Device Context**: Cada evento registra device_id, session_id, timestamp, enrollment_id\n- **Event Coverage**: Log m\u00ednimo: section unlock/complete, attempt start/submit/result, certificate issuance\n- **Delivery Logging**: Notification delivery tambi\u00e9n se loggea (ver notifications)\n- **Compliance Evidence**: Audit trail para mandatory training (idea.txt \u00a78)\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (AuditEvent model, admin.py)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (section unlock/complete events)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (attempt events)\n- Relacionado: [Certificate](../specs/certificate.md) (issuance events)\n- Relacionado: [Notifications](../specs/notifications.md) (delivery logging)\n- Relacionado: [Expediente](../specs/expediente.md) (both have retention requirements)\n\n## Decisiones de dise\u00f1o\n\n- RGPD assumption 8: WORM only if mandated; MVP requires append-only immutability\n- AuditEvent model: no create/update/delete API (solo append via services)\n- Django admin: AuditEvent registered as read-only (no edit/delete buttons)\n- Device context: device_id, session_id para cross-device evidence correlation\n- Retention: audit records follow same retention policy as expediente", "specs/authentication": "# Authentication\n\nAdmin login/logout con server-side session (Django session). Employee access via magic-link/code token sin password.\n\n## Requisitos clave\n\n- **Admin Password Session**: Admins se autentican con username/password y mantienen sesi\u00f3n server-side\n- **Employee Magic-Link**: Empleados acceden solo con token/magic-link emitido (sin password)\n- **Session Isolation**: Sesiones admin y employee est\u00e1n aisladas; token employee NO concede acceso admin\n- **Admin Logout**: Logout invalida sesi\u00f3n server-side\n\n## Relaciones\n\n- Implementado en: [Backend Authentication](../backend/authentication.md)\n- Relacionado: [Secure Access](../specs/secure-access.md) (emisi\u00f3n de tokens employee)\n- Relacionado: [Notifications](../specs/notifications.md) (env\u00edo de magic-link)\n- Frontend: [Auth](../frontend/auth.md) (AdminLogin, EmployeeRedeem)\n\n## Decisiones de dise\u00f1o\n\n- RGPD assumption 4: email possession \u2248 identity para MVP\n- Weak binding aceptada, flagged para phase-2 strengthening\n- Server-side session para admin (no JWT)", "specs/badges": "# Badges\n\nSistema de badges para reconocimiento de logros de empleados.\n\n## Requisitos clave\n\n- **Badge Definition**: Admin define badges (nombre, descripci\u00f3n, icon, criteria)\n- **Automatic Award**: Badge se otorga autom\u00e1ticamente cuando empleado cumple criteria\n- **Pass Trigger**: Pass de curso \u2192 award de badge asociado (si existe)\n- **Employee Display**: Empleados ven sus badges en dashboard\n- **Badge Criteria**: Criteria puede ser: pass specific course, pass N courses, score >= threshold\n\n## Relaciones\n\n- Implementado en: [Backend Certificates](../backend/certificates.md) (Badge, EmployeeBadge models)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (pass \u2192 badge award)\n- Relacionado: [Course Management](../specs/course-management.md) (course \u2192 badge mapping)\n- Frontend: [Employee](../frontend/employee.md) (badge display en dashboard)\n\n## Decisiones de dise\u00f1o\n\n- Badge award autom\u00e1tico (no manual)\n- Criteria evaluado server-side en certificates.services\n- Lazy import en reading_gate.services (evitar circular dependency)\n- EmployeeBadge tiene timestamp (cu\u00e1ndo se otorg\u00f3)", "specs/certificate": "# Certificate\n\nGeneraci\u00f3n de certificado PDF con datos del empleado, curso, y resultado.\n\n## Requisitos clave\n\n- **Printable PDF**: PDF con nombre completo, DNI, fecha, t\u00edtulo curso, evaluaci\u00f3n, summary index\n- **DNI Verbatim**: DNI se imprime tal cual (sin formatear, sin a\u00f1adir letra)\n- **One Per Enrollment**: M\u00e1ximo un certificado activo por enrollment pasado\n- **Regeneration**: Regenerar reproduce mismo contenido (mismos campos core)\n- **Result Data**: Certificado incluye datos de expediente (status, score, attempts)\n\n## Relaciones\n\n- Implementado en: [Backend Certificates](../backend/certificates.md)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (pass \u2192 certificate trigger)\n- Relacionado: [Expediente](../specs/expediente.md) (result data source)\n- Relacionado: [Employee Import](../specs/employee-import.md) (DNI verbatim storage)\n- Relacionado: [Audit Log](../specs/audit-log.md) (log certificate issuance)\n- Frontend: [Admin](../frontend/admin.md) (admin downloads PDF)\n\n## Decisiones de dise\u00f1o\n\n- RGPD assumption 2: printable PDF, NO e-signature (formal legal validity not required at MVP)\n- DNI verbatim (no formatting) \u2014 stored as-is in employee record\n- Certificate regeneration = same content (deterministic)\n- Lazy import de reading_gate.services en certificates.views (audit events)", "specs/comprehension-test": "# Comprehension Test\n\nTest de comprensi\u00f3n post-reading con l\u00edmite de intentos, scoring, y pass/fail.\n\n## Requisitos clave\n\n- **Test Unlock**: Test se habilita solo cuando reading est\u00e1 completo (todas secciones pasan gate)\n- **Question Bank**: Preguntas del curso (single correct answer por spec course-management \u00a7Single Correct)\n- **Attempt Limit**: M\u00e1ximo de intentos configurable por curso\n- **Scoring**: Score = preguntas correctas / total preguntas\n- **Pass Threshold**: Threshold configurable (ej. 70%)\n- **Result Storage**: Resultado (status, attempts, score) se guarda en expediente\n- **Certificate Trigger**: Pass \u2192 habilita generaci\u00f3n de certificado\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (services.py: process_test_submission)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (test unlock post-reading)\n- Relacionado: [Course Management](../specs/course-management.md) (Question model, question bank)\n- Relacionado: [Certificate](../specs/certificate.md) (pass \u2192 certificate generation)\n- Relacionado: [Badges](../specs/badges.md) (pass \u2192 badge award)\n- Relacionado: [Expediente](../specs/expediente.md) (result storage)\n- Relacionado: [Audit Log](../specs/audit-log.md) (log attempt start/submit/result)\n\n## Decisiones de dise\u00f1o\n\n- Single correct answer (no partial credit)\n- Attempt limit hard (no m\u00e1s intentos tras agotar)\n- Score calculado server-side (client NO env\u00eda score)\n- Result inmutable post-submission", "specs/course-management": "# Course Management\n\nCRUD de cursos con secciones, question banks, y mapeo a posiciones.\n\n## Requisitos clave\n\n- **Course CRUD**: Admin crea/edita cursos con t\u00edtulo, descripci\u00f3n, metadata\n- **Section Management**: Cursos tienen secciones (PDFs) con orden y minTimePerSection\n- **Question Bank**: Banco de preguntas por curso (multiple choice, single correct)\n- **Position Mapping**: Mapeo N:M entre cursos y posiciones (cat\u00e1logo obligatorio)\n- **HITL for AI**: Contenido generado por AI requiere revisi\u00f3n/explicit save del admin\n\n## Relaciones\n\n- Implementado en: [Backend Courses](../backend/courses.md)\n- Relacionado: [AI Generation](../specs/ai-generation.md) (generaci\u00f3n de contenido/tests)\n- Relacionado: [Enrollment Assignment](../specs/enrollment-assignment.md) (Position-Course mapping)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (sections con minTime)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (question bank)\n- Frontend: [Admin](../frontend/admin.md) (CourseManagement component)\n\n## Decisiones de dise\u00f1o\n\n- Question tiene Position (orden dentro de bank)\n- Single correct answer por question (spec comprehension-test \u00a7Single Correct)\n- AI-generated content NO se persiste autom\u00e1ticamente (HITL)", "specs/employee-import": "# Employee Import\n\nImportaci\u00f3n masiva de empleados desde Excel con validaci\u00f3n, cifrado DNI y deduplicaci\u00f3n.\n\n## Requisitos clave\n\n- **Excel Upload**: Admin sube archivo .xlsx con columnas: nombre, email, DNI, posici\u00f3n\n- **DNI Encryption**: DNI se cifra con AES-GCM antes de persistir (non-deterministic)\n- **DNI Dedup**: HMAC determin\u00edstico para detectar DNI duplicados sin exponer valor\n- **Validation Report**: Report de errores (filas inv\u00e1lidas, duplicados, DNI inv\u00e1lido)\n- **Verbatim Storage**: DNI se guarda tal cual (sin formatear) para certificados\n\n## Relaciones\n\n- Implementado en: [Backend Employees](../backend/employees.md)\n- Relacionado: [Common](../backend/common.md) (crypto, fields, dni utilities)\n- Relacionado: [Enrollment Assignment](../specs/enrollment-assignment.md) (asignaci\u00f3n autom\u00e1tica post-import)\n- Frontend: [Admin](../frontend/admin.md) (EmployeeImport component)\n\n## Decisiones de dise\u00f1o\n\n- DNI verbatim en certificado (sin formatear)\n- Cifrado non-deterministic (AES-GCM + random nonce)\n- HMAC para lookup/dedup sin exponer DNI plaintext\n- RGPD: right to erasure requiere delete de ciphertext + HMAC", "specs/enrollment-assignment": "# Enrollment Assignment\n\nAsignaci\u00f3n autom\u00e1tica de cursos obligatorios a empleados basada en su posici\u00f3n.\n\n## Requisitos clave\n\n- **Position-Course Mapping**: Cada posici\u00f3n tiene cat\u00e1logo de cursos obligatorios\n- **Auto-Assignment**: Al importar empleado, se asignan autom\u00e1ticamente cursos obligatorios\n- **Mandatory Flag**: Cursos marcados como mandatory vs optional\n- **Enrollment Creation**: Se crea Enrollment record por cada curso asignado\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (assign_mandatory_courses service)\n- Relacionado: [Course Management](../specs/course-management.md) (Position model, Course-Position mapping)\n- Relacionado: [Employee Import](../specs/employee-import.md) (trigger de auto-assignment)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (enrollment \u2192 reading progress)\n\n## Decisiones de dise\u00f1o\n\n- Assignment ocurre en employees.views (post-import)\n- Llama a reading_gate.services.assign_mandatory_courses\n- Idempotente: no duplica enrollments existentes", "specs/expediente": "# Expediente\n\nAlmacenamiento de resultados por enrollment con filtering admin y pol\u00edtica de retenci\u00f3n.\n\n## Requisitos clave\n\n- **Result Storage**: Expediente guarda status, attempts, score, dates por enrollment\n- **Admin Filter**: Admin filtra empleados por completion de curso espec\u00edfico\n- **Retention Policy**: Expediente se retiene seg\u00fan pol\u00edtica (employee end + legal period)\n- **Rollback Protection**: Expediente NO se purga en application rollback\n- **Result Data Source**: Expediente es fuente de datos para certificados\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (Expediente model)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (result \u2192 expediente)\n- Relacionado: [Certificate](../specs/certificate.md) (expediente \u2192 certificate data)\n- Relacionado: [Audit Log](../specs/audit-log.md) (both have retention requirements)\n- Frontend: [Admin](../frontend/admin.md) (ExpedienteList, Dashboard)\n\n## Decisiones de dise\u00f1o\n\n- Expediente linked to Employee + Course (composite key)\n- Retention policy configurable en settings (EMPLOYEE_RETENTION_YEARS)\n- Rollback protection: Expediente marked as protected (no cascade delete)\n- Admin filter: queryset filtering por course completion status", "specs/notifications": "# Notifications\n\nSistema de notificaciones email con transporte configurable y templates en espa\u00f1ol.\n\n## Requisitos clave\n\n- **Configurable Transport**: Console (dev), SMTP, Resend (prod) \u2014 configurable via settings\n- **Spanish Templates**: Todos los templates en espa\u00f1ol (RGPD assumption \u2014 usuarios espa\u00f1oles)\n- **Delivery Logging**: NotificationLog persiste status (sent/failed), timestamp, recipient\n- **Token Delivery**: Env\u00edo de magic-link/token a empleados (ver secure-access)\n- **No Opt-Out**: Mandatory training notifications no tienen opt-out (compliance)\n\n## Relaciones\n\n- Implementado en: [Backend Notifications](../backend/notifications.md)\n- Relacionado: [Secure Access](../specs/secure-access.md) (token delivery)\n- Relacionado: [Authentication](../specs/authentication.md) (employee magic-link)\n- Relacionado: [Audit Log](../specs/audit-log.md) (delivery logging)\n\n## Decisiones de dise\u00f1o\n\n- Email transport abstraction (console/smtp/resend)\n- Templates hardcoded en espa\u00f1ol (no i18n para MVP)\n- NotificationLog append-only (evidence trail)\n- Lazy import en reading_gate.services (evitar circular dependency)", "specs/secure-access": "# Secure Access\n\nEmisi\u00f3n y redenci\u00f3n de tokens de acceso para empleados. Un solo uso, expiraci\u00f3n configurable.\n\n## Requisitos clave\n\n- **Token Generation**: Generar token \u00fanico por empleado, cifrado en BD\n- **Token Delivery**: Enviar magic-link por email (ver notifications)\n- **Token Redemption**: Validar token no usado, autenticar empleado, marcar como usado\n- **Expiration**: Tokens expiran tras tiempo configurable o primer uso\n\n## Relaciones\n\n- Implementado en: [Backend Authentication](../backend/authentication.md) (EmployeeAccessToken model)\n- Relacionado: [Authentication](../specs/authentication.md) (sesi\u00f3n employee post-redenci\u00f3n)\n- Relacionado: [Notifications](../specs/notifications.md) (env\u00edo de token)\n- Frontend: [Auth](../frontend/auth.md) (EmployeeRedeem component)\n\n## Decisiones de dise\u00f1o\n\n- Token cifrado con AES-GCM + nonce aleatorio\n- HMAC separado para deduplicaci\u00f3n determin\u00edstica\n- Raw token NUNCA se loggea o expone en respuestas", "specs/timed-reading": "# Timed Reading\n\nGate server-side para tiempo de lectura. Secciones no se desbloquean hasta acumular minTime.\n\n## Requisitos clave\n\n- **Server-Gated Unlock**: Secci\u00f3n NO se marca completa hasta server valida active time >= minTimePerSection\n- **minTimePerSection**: `sectionBase / 3` (configurable por curso)\n- **Heartbeat Validation**: Cliente env\u00eda heartbeats de actividad; server valida y acumula tiempo\n- **Active-Time Only**: Solo se acredita tiempo con heartbeats v\u00e1lidos (gap detection)\n- **Cross-Device Resume**: Persistir progress (accumulated time + reached section) por enrollment\n- **Completion**: Reading completo cuando TODAS las secciones pasan gate \u2192 habilita comprehension test\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (services.py: process_heartbeat, check_gate)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (test unlock post-reading)\n- Relacionado: [Audit Log](../specs/audit-log.md) (log section unlock/complete events)\n- Relacionado: [Course Management](../specs/course-management.md) (Section model con minTimePerSection)\n- Frontend: [Components](../frontend/components.md) (PdfReader con heartbeat)\n\n## Decisiones de dise\u00f1o\n\n- Server authority = compliance artifact (RGPD assumption 3)\n- Client-only gating trivially bypassable \u2192 no trustworthy evidence\n- Heartbeat tolerance configurable\n- Progress persistido en ReadingProgress model (enrollment-scoped)"}, "types": ["backend-module", "frontend-module", "spec"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
