[pytest]
# SDD PR6 (Phase 15): pytest harness for the MVP backend.
# Run with:  python -m pytest            (from the backend/ dir)
# Or keep using Django's runner:  python manage.py test
DJANGO_SETTINGS_MODULE = mvp_project.settings
python_files = test*.py
addopts = -p no:cacheprovider
# We configure settings explicitly above, so don't require a manage.py in CWD.
django_find_project = false
