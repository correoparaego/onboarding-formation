ider\n- **FakeLLMClient**: Mock para testing (no API calls)\n\n## Relaciones\n\n- Spec: [AI Generation](../specs/ai-generation.md)\n- Relacionado: [Course Management](../specs/course-management.md) (content/test generation)\n- Frontend: [Admin](../frontend/admin.md) (AiKeyForm, GuidedContent, PdfTestGen - lazy loaded)\n\n## Dependencias\n\n- Importa: [Common](../backend/common.md) (crypto para key encryption)\n- No tiene circular dependencies\n- Sanitizer deliberadamente NO importa employees (PII exclusion by construction)\n\n## Patrones clave\n\n- Provider-agnostic: OpenAI-compatible interface\n- AdminLLMKey cifrado con AES-GCM + random nonce\n- Raw key NUNCA en serialized responses\n- Sanitizer: PII exclusion by construction (no importa employees)\n- HITL: draft NO se persiste hasta explicit save del admin", "color": "#7c3aed"}, {"id": "backend/authentication", "label": "Authentication (Django App)", "type": "backend-module", "description": "Admin login/logout, employee access token, role isolation middleware", "resource": "backend/authentication/", "tags": ["django", "app", "auth", "session", "token", "employee-access", "admin-login", "middleware"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "backend/authentication.md", "body": "# Authentication (Django App)\n\nApp Django para autenticación admin (session) y employee (token), con middleware de aislamiento.\n\n## Modelos\n\n- **EmployeeAccessToken**: Token de acceso para empleados (cifrado, un solo uso, expirable)\n\n## Views/APIs\n\n- Admin login (POST /api/auth/login)\n- Admin logout (POST /api/auth/logout)\n- Employee redeem (POST /api/auth/redeem)\n\n## Middleware\n\n- **RoleIsolationMiddleware**: Aísla sesiones admin/employee; employee token NO concede acceso admin\n\n## Relaciones\n\n- Spec: [Authentication](../specs/authentication.md)\n- Spec: [Secure Access](../specs/secure-access.md) (EmployeeAccessToken)\n- Importado por: [Notifications](../backen [Security Model](../security/security-model.md)\n- Operación: [Render Deployment](../deployment/render.md)\n- Calidad: [Testing and Quality](../quality/testing.md)\n- Ciclo formativo: [Assignment Lifecycle](../features/assignment-lifecycle.md)\n- Evidencia completa: [Technical Documentation](../documentation/technical-documentation.md)", "color": "#dc2626"}, {"id": "security/security-model", "label": "Security Model", "type": "security", "description": "Session authentication, one-time employee access, encrypted DNI, CSRF, and private content boundaries", "resource": "backend/mvp_project/settings.py", "tags": ["session", "csrf", "cors", "aes-gcm", "hmac", "token", "authorization", "secrets"], "status": "active", "generated": "2026-07-28", "verified": [], "trust_tier": "human-reviewed", "source": "security/security-model.md", "body": "# Security Model\n\nAdministradores usan sesión Django; empleados canjean credenciales temporales. El DNI usa AES-GCM y lookup HMAC. CSRF protege mutaciones generales y los PDFs requieren ownership.\n\n## Relaciones\n\n- Auth: [Authentication](../backend/authentication.md)\n- Criptografía: [Common](../backend/common.md)\n- Acceso: [Secure Access](../specs/secure-access.md)\n- Infraestructura: [Render Deployment](../deployment/render.md)\n- Deuda: [Production Readiness](../risks/production-readiness.md)", "color": "#b91c1c"}, {"id": "specs/ai-generation", "label": "AI Generation", "type": "spec", "description": "AI content generation with BYO LLM key, HITL workflow, and PII protection", "resource": "openspec/specs/ai-generation/spec.md", "tags": ["ai", "llm", "openai", "generation", "hitl", "encryption", "pii"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/ai-generation.md", "body": "# AI Generation\n\nGeneración de contenido y tests con LLM externo (BYO key), human-in-the-loop, y protección PII.\n\n## Requisitos clave\n\n- **BYO LLM Key**: Admin almacena su propia API key (OpenAI-compatible), cifrada at-rest\n- **Key Isolation**: Raw key NUNCA se expone en respuestas, logs, audit, o rutas employee\n- **OpenAI-Compatible Client**: Interfaz unificada (base_url, api_key, model) para cualquier provider\n- **Guided Content Gen**: Admin responde preguntas guiadas + sube docs → draft para revisión\n- **PDF-to-Test Gen**: Admin sube PDF → AI genera questions para question bank\n- **HITL**: Draft NO se persiste hasta explicit save del admin\n- **PII Guard**: Sanitizer excluye PII antes de enviar a LLM (sanitizer NO importa employees)\n\n## Relaciones\n\n- Implementado en: [Backend AI Generation](../backend/ai_generation.md)\n- Relacionado: [Course Management](../specs/course-management.md) (content/test generation)\n- Relacionado: [Common](../backend/common.md) (crypto para key encryption)\n- Frontend: [Admin](../frontend/admin.md) (AiKeyForm, GuidedContent, PdfTestGen - lazy loaded)\n\n## Decisiones de diseño\n\n- Provider-agnostic: OpenAI-compatible interface (OpenAI/Groq/Together/Ollama)\n- FakeLLMClient para testing (no API calls)\n- Sanitizer deliberadamente NO importa employees (PII exclusion by construction)\n- AdminLLMKey cifrado con AES-GCM + random nonce\n- Raw key NUNCA en serialized responses (override de to_representation)", "color": "#2563eb"}, {"id": "specs/audit-log", "label": "Audit Log", "type": "spec", "description": "Append-only audit log for reading and exam events with device context", "resource": "openspec/specs/audit-log/spec.md", "tags": ["audit", "log", "append-only", "immutable", "compliance", "rgpd", "worm"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/audit-log.md", "body": "# Audit Log\n\nAudit log append-only para eventos de lectura y examen. Inmutable, con contexto de dispositivo.\n\n## Requisitos clave\n\n- **Append-Only**: Audit log solo permite append; NO edit, NO delete por application users\n- **No Mutation**: Sistema rechaza cualquier update/delete en audit records\n- **Cross-Device Context**: Cada evento registra device_id, session_id, timestamp, enrollment_id\n- **Event Coverage**: Log mínimo: section unlock/complete, attempt start/submit/result, certificate issuance\n- **Delivery Logging**: Notification delivery también se loggea (ver notifications)\n- **Compliance Evidence**: Audit trail para mandatory training (idea.txt §8)\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (AuditEvent model, admin.py)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (section unlock/complete events)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (attempt events)\n- Relacionado: [Certificate](../specs/certificate.md) (issuance events)\n- Relacionado: [Notifications](../specs/notifications.md) (delivery logging)\n- Relacionado: [Expediente](../specs/expediente.md) (both have retention requirements)\n\n## Decisiones de diseño\n\n- RGPD assumption 8: WORM only if mandated; MVP requires append-only immutability\n- AuditEvent model: no create/update/delete API (solo append via services)\n- Django admin: AuditEvent registered as read-only (no edit/delete buttons)\n- Device context: device_id, session_id para cross-device evidence correlation\n- Retention: audit records follow same retention policy as expediente", "color": "#2563eb"}, {"id": "specs/authentication", "label": "Authentication", "type": "spec", "description": "Admin password session + employee magic-link authentication with role isolation", "resource": "openspec/specs/authentication/spec.md", "tags": ["auth", "security", "session", "rgpd", "admin", "employee"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/authentication.md", "body": "# Authentication\n\nAdmin login/logout con server-side session (Django session). Employee access via magic-link/code token sin password.\n\n## Requisitos clave\n\n- **Admin Password Session**: Admins se autentican con username/password y mantienen sesión server-side\n- **Employee Magic-Link**: Empleados acceden solo con token/magic-link emitido (sin password)\n- **Session Isolation**: Sesiones admin y employee están aisladas; token employee NO concede acceso admin\n- **Admin Logout**: Logout invalida sesión server-side\n\n## Relaciones\n\n- Implementado en: [Backend Authentication](../backend/authentication.md)\n- Relacionado: [Secure Access](../specs/secure-access.md) (emisión de tokens employee)\n- Relacionado: [Notifications](../specs/notifications.md) (envío de magic-link)\n- Frontend: [Auth](../frontend/auth.md) (AdminLogin, EmployeeRedeem)\n\n## Decisiones de diseño\n\n- RGPD assumption 4: email possession ≈ identity para MVP\n- Weak binding aceptada, flagged para phase-2 strengthening\n- Server-side session para admin (no JWT)", "color": "#2563eb"}, {"id": "specs/badges", "label": "Badges", "type": "spec", "description": "Badge system for employee achievement and recognition", "resource": "openspec/specs/badges/spec.md", "tags": ["badge", "award", "gamification", "recognition"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/badges.md", "body": "# Badges\n\nSistema de badges para reconocimiento de logros de empleados.\n\n## Requisitos clave\n\n- **Badge Definition**: Admin define badges (nombre, descripción, icon, criteria)\n- **Automatic Award**: Badge se otorga automáticamente cuando empleado cumple criteria\n- **Pass Trigger**: Pass de curso → award de badge asociado (si existe)\n- **Employee Display**: Empleados ven sus badges en dashboard\n- **Badge Criteria**: Criteria puede ser: pass specific course, pass N courses, score >= threshold\n\n## Relaciones\n\n- Implementado en: [Backend Certificates](../backend/certificates.md) (Badge, EmployeeBadge models)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (pass → badge award)\n- Relacionado: [Course Management](../specs/course-management.md) (course → badge mapping)\n- Frontend: [Employee](../frontend/employee.md) (badge display en dashboard)\n\n## Decisiones de diseño\n\n- Badge award automático (no manual)\n- Criteria evaluado server-side en certificates.services\n- Lazy import en reading_gate.services (evitar circular dependency)\n- EmployeeBadge tiene timestamp (cuándo se otorgó)", "color": "#2563eb"}, {"id": "specs/certificate", "label": "Certificate", "type": "spec", "description": "PDF certificate generation with employee data, course info, and result summary", "resource": "openspec/specs/certificate/spec.md", "tags": ["certificate", "pdf", "dni", "verbatim", "regeneration", "compliance"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/certificate.md", "body": "# Certificate\n\nGeneración de certificado PDF con datos del empleado, curso, y resultado.\n\n## Requisitos clave\n\n- **Printable PDF**: PDF con nombre completo, DNI, fecha, título curso, evaluación, summary index\n- **DNI Verbatim**: DNI se imprime tal cual (sin formatear, sin añadir letra)\n- **One Per Enrollment**: Máximo un certificado activo por enrollment pasado\n- **Regeneration**: Regenerar reproduce mismo contenido (mismos campos core)\n- **Result Data**: Certificado incluye datos de expediente (status, score, attempts)\n\n## Relaciones\n\n- Implementado en: [Backend Certificates](../backend/certificates.md)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (pass → certificate trigger)\n- Relacionado: [Expediente](../specs/expediente.md) (result data source)\n- Relacionado: [Employee Import](../specs/employee-import.md) (DNI verbatim storage)\n- Relacionado: [Audit Log](../specs/audit-log.md) (log certificate issuance)\n- Frontend: [Admin](../frontend/admin.md) (admin downloads PDF)\n\n## Decisiones de diseño\n\n- RGPD assumption 2: printable PDF, NO e-signature (formal legal validity not required at MVP)\n- DNI verbatim (no formatting) — stored as-is in employee record\n- Certificate regeneration = same content (deterministic)\n- Lazy import de reading_gate.services en certificates.views (audit events)", "color": "#2563eb"}, {"id": "specs/comprehension-test", "label": "Comprehension Test", "type": "spec", "description": "Comprehension test with attempt limits, scoring, and pass/fail logic", "resource": "openspec/specs/comprehension-test/spec.md", "tags": ["test", "comprehension", "question", "attempt", "score", "pass"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/comprehension-test.md", "body": "# Comprehension Test\n\nTest de comprensión post-reading con límite de intentos, scoring, y pass/fail.\n\n## Requisitos clave\n\n- **Test Unlock**: Test se habilita solo cuando reading está completo (todas secciones pasan gate)\n- **Question Bank**: Preguntas del curso (single correct answer por spec course-management §Single Correct)\n- **Attempt Limit**: Máximo de intentos configurable por curso\n- **Scoring**: Score = preguntas correctas / total preguntas\n- **Pass Threshold**: Threshold configurable (ej. 70%)\n- **Result Storage**: Resultado (status, attempts, score) se guarda en expediente\n- **Certificate Trigger**: Pass → habilita generación de certificado\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (services.py: process_test_submission)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (test unlock post-reading)\n- Relacionado: [Course Management](../specs/course-management.md) (Question model, question bank)\n- Relacionado: [Certificate](../specs/certificate.md) (pass → certificate generation)\n- Relacionado: [Badges](../specs/badges.md) (pass → badge award)\n- Relacionado: [Expediente](../specs/expediente.md) (result storage)\n- Relacionado: [Audit Log](../specs/audit-log.md) (log attempt start/submit/result)\n\n## Decisiones de diseño\n\n- Single correct answer (no partial credit)\n- Attempt limit hard (no más intentos tras agotar)\n- Score calculado server-side (client NO envía score)\n- Result inmutable post-submission", "color": "#2563eb"}, {"id": "specs/course-management", "label": "Course Management", "type": "spec", "description": "Course CRUD with sections, question banks, and position mapping", "resource": "openspec/specs/course-management/spec.md", "tags": ["course", "section", "question", "position", "catalog", "admin"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/course-management.md", "body": "# Course Management\n\nCRUD de cursos con secciones, question banks, y mapeo a posiciones.\n\n## Requisitos clave\n\n- **Course CRUD**: Admin crea/edita cursos con título, descripción, metadata\n- **Section Management**: Cursos tienen secciones (PDFs) con orden y minTimePerSection\n- **Question Bank**: Banco de preguntas por curso (multiple choice, single correct)\n- **Position Mapping**: Mapeo N:M entre cursos y posiciones (catálogo obligatorio)\n- **HITL for AI**: Contenido generado por AI requiere revisión/explicit save del admin\n\n## Relaciones\n\n- Implementado en: [Backend Courses](../backend/courses.md)\n- Relacionado: [AI Generation](../specs/ai-generation.md) (generación de contenido/tests)\n- Relacionado: [Enrollment Assignment](../specs/enrollment-assignment.md) (Position-Course mapping)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (sections con minTime)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (question bank)\n- Frontend: [Admin](../frontend/admin.md) (CourseManagement component)\n\n## Decisiones de diseño\n\n- Question tiene Position (orden dentro de bank)\n- Single correct answer por question (spec comprehension-test §Single Correct)\n- AI-generated content NO se persiste automáticamente (HITL)", "color": "#2563eb"}, {"id": "specs/employee-import", "label": "Employee Import", "type": "spec", "description": "Excel import of employees with DNI encryption and deduplication", "resource": "openspec/specs/employee-import/spec.md", "tags": ["import", "excel", "employee", "dni", "encryption", "rgpd"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/employee-import.md", "body": "# Employee Import\n\nImportación masiva de empleados desde Excel con validación, cifrado DNI y deduplicación.\n\n## Requisitos clave\n\n- **Excel Upload**: Admin sube archivo .xlsx con columnas: nombre, email, DNI, posición\n- **DNI Encryption**: DNI se cifra con AES-GCM antes de persistir (non-deterministic)\n- **DNI Dedup**: HMAC determinístico para detectar DNI duplicados sin exponer valor\n- **Validation Report**: Report de errores (filas inválidas, duplicados, DNI inválido)\n- **Verbatim Storage**: DNI se guarda tal cual (sin formatear) para certificados\n\n## Relaciones\n\n- Implementado en: [Backend Employees](../backend/employees.md)\n- Relacionado: [Common](../backend/common.md) (crypto, fields, dni utilities)\n- Relacionado: [Enrollment Assignment](../specs/enrollment-assignment.md) (asignación automática post-import)\n- Frontend: [Admin](../frontend/admin.md) (EmployeeImport component)\n\n## Decisiones de diseño\n\n- DNI verbatim en certificado (sin formatear)\n- Cifrado non-deterministic (AES-GCM + random nonce)\n- HMAC para lookup/dedup sin exponer DNI plaintext\n- RGPD: right to erasure requiere delete de ciphertext + HMAC", "color": "#2563eb"}, {"id": "specs/enrollment-assignment", "label": "Enrollment Assignment", "type": "spec", "description": "Automatic enrollment assignment based on employee position", "resource": "openspec/specs/enrollment-assignment/spec.md", "tags": ["enrollment", "assignment", "course", "position", "mandatory"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/enrollment-assignment.md", "body": "# Enrollment Assignment\n\nAsignación automática de cursos obligatorios a empleados basada en su posición.\n\n## Requisitos clave\n\n- **Position-Course Mapping**: Cada posición tiene catálogo de cursos obligatorios\n- **Auto-Assignment**: Al importar empleado, se asignan automáticamente cursos obligatorios\n- **Mandatory Flag**: Cursos marcados como mandatory vs optional\n- **Enrollment Creation**: Se crea Enrollment record por cada curso asignado\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (assign_mandatory_courses service)\n- Relacionado: [Course Management](../specs/course-management.md) (Position model, Course-Position mapping)\n- Relacionado: [Employee Import](../specs/employee-import.md) (trigger de auto-assignment)\n- Relacionado: [Timed Reading](../specs/timed-reading.md) (enrollment → reading progress)\n\n## Decisiones de diseño\n\n- Assignment ocurre en employees.views (post-import)\n- Llama a reading_gate.services.assign_mandatory_courses\n- Idempotente: no duplica enrollments existentes", "color": "#2563eb"}, {"id": "specs/expediente", "label": "Expediente", "type": "spec", "description": "Employee course result storage with admin filtering and retention policy", "resource": "openspec/specs/expediente/spec.md", "tags": ["expediente", "result", "retention", "admin", "filter", "compliance"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/expediente.md", "body": "# Expediente\n\nAlmacenamiento de resultados por enrollment con filtering admin y política de retención.\n\n## Requisitos clave\n\n- **Result Storage**: Expediente guarda status, attempts, score, dates por enrollment\n- **Admin Filter**: Admin filtra empleados por completion de curso específico\n- **Retention Policy**: Expediente se retiene según política (employee end + legal period)\n- **Rollback Protection**: Expediente NO se purga en application rollback\n- **Result Data Source**: Expediente es fuente de datos para certificados\n\n## Relaciones\n\n- Implementado en: [Backend Reading Gate](../backend/reading_gate.md) (Expediente model)\n- Relacionado: [Comprehension Test](../specs/comprehension-test.md) (result → expediente)\n- Relacionado: [Certificate](../specs/certificate.md) (expediente → certificate data)\n- Relacionado: [Audit Log](../specs/audit-log.md) (both have retention requirements)\n- Frontend: [Admin](../frontend/admin.md) (ExpedienteList, Dashboard)\n\n## Decisiones de diseño\n\n- Expediente linked to Employee + Course (composite key)\n- Retention policy configurable en settings (EMPLOYEE_RETENTION_YEARS)\n- Rollback protection: Expediente marked as protected (no cascade delete)\n- Admin filter: queryset filtering por course completion status", "color": "#2563eb"}, {"id": "specs/notifications", "label": "Notifications", "type": "spec", "description": "Email notification system with configurable transport and Spanish templates", "resource": "openspec/specs/notifications/spec.md", "tags": ["notifications", "email", "transport", "template", "spanish", "delivery"], "status": "active", "generated": "2026-07-27", "verified": [], "trust_tier": "unverified", "source": "specs/notifications.md", "body": "# Notifications\n\nSistema de notificaciones email con transporte configurable y templates en español.\n\n## Requisitos clave\n\n- **Configurable Transport**: Console (dev), SMTP, Resend (prod) — configurable via settings\n- **Spanish Templates**: Todos los templates en español (RGPD assumption — usuarios españoles)\n- **Delivery Logging**: NotificationLog persiste status (sent/failed), timestamp, recipient\n- **Token Delivery**: Envío de magic-link/token a empleados (ver secure-access)\n- **No Opt-Out**: Mandatory training notifications no tienen opt-out (compliance)\n\n## Relaciones\n\n- Implementado en: [Backend Notifications](../backend/notifications.md)\n- Relacionado: [Secure Access](../specs/secure-access.md) (token delivery)\n- Relacionado: [Authentication](../specs/authentication.md) (employee
