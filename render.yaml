services:
  # Backend Django API
  - type: web
    name: onboarding-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: POSTGRES_DB
        value: ${onboarding-db.POSTGRES_DB}
      - key: POSTGRES_USER
        value: ${onboarding-db.POSTGRES_USER}
      - key: POSTGRES_PASSWORD
        value: ${onboarding-db.POSTGRES_PASSWORD}
      - key: POSTGRES_HOST
        value: ${onboarding-db.POSTGRES_HOST}
      - key: POSTGRES_PORT
        value: ${onboarding-db.POSTGRES_PORT}
      - key: DNI_ENCRYPTION_KEY
        generateValue: true
      - key: AI_USE_FAKE_LLM
        value: "true"
      - key: EMAIL_TRANSPORT
        value: "console"

  # Frontend React Static Site
  - type: web
    name: onboarding-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
